name: Store prices

# Nightly (02:00 Bogotá): refresh prices of matched products. Reads VTEX stores at 1 req/s each.
# No AI here: matching new ingredients lives in store-matching.yml and runs by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: store-prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun --conditions=react-server jobs/refresh-prices.ts
