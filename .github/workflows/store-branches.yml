name: Store branches

# Weekly (Monday 03:00 Bogotá): supermarket branches around Barranquilla from OpenStreetMap. No AI.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun --conditions=react-server jobs/sync-branches.ts
