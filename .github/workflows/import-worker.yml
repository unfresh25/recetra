name: Import worker

# Finishes imports the web app can't: Instagram posts and videos whose caption
# has no ingredient list (yt-dlp + Groq Whisper). The app dispatches it on demand;
# the schedule is a daily safety net.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

concurrency:
  group: import-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install yt-dlp
        run: pipx install yt-dlp
      - run: bun --conditions=react-server jobs/import-worker.ts
